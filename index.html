<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sit/Stand – Woche 2</title>

<style>
    /* === Vollbild-Hintergrund über die ganze Seite === */
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #0d0f2a;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        color: #dfe4ff;
        font-family: Arial, sans-serif;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    h2 {
        margin-bottom: 8px; /* Für optimale vertikale Kompaktheit */
        color: #e0e6ff;
        font-weight: 600;
    }

    .timer {
        margin: 4px 0; /* Minimal kompakter für den Reset-Button */
        font-size: 1.32em;
        color: #cbd3ff;
    }

    /* === Settings-Zeile (kompakt mit Reset-Button) === */
    .settings-row {
        margin: 12px 0;
        font-size: 1.0em; /* Leicht verkleinert, damit alles in eine Zeile passt */
        color: #aab4ff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .small-btn {
        padding: 3px 8px;
        margin: 0;
        width: auto;
        background: rgba(70, 80, 130, 0.45);
        border: 1px solid rgba(130, 150, 255, 0.35);
        color: #e4e6ff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85em;
        transition: 0.2s;
    }

    .small-btn:hover {
        background: rgba(130, 150, 255, 0.25);
    }

    /* Rötlich schimmernder Reset-Button */
    .reset-btn {
        background: rgba(180, 70, 70, 0.4);
        border: 1px solid rgba(255, 120, 120, 0.35);
        color: #ffcccc;
        margin-left: 4px;
    }

    .reset-btn:hover {
        background: rgba(255, 120, 120, 0.25);
        box-shadow: 0 0 10px rgba(255, 120, 120, 0.3);
    }

    /* === Buttons untereinander === */
    .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 8px;
        width: 100%;
        max-width: 300px;
    }

    /* === Haupt-Buttons === */
    button:not(.small-btn) {
        padding: 12px 25px;
        margin: 5px 0;
        width: 100%;
        background: rgba(70, 80, 130, 0.45);
        border: 1px solid rgba(130, 150, 255, 0.35);
        color: #e4e6ff;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.25s;
        font-size: 1.26em;
    }

    button:not(.small-btn):hover {
        background: rgba(130, 150, 255, 0.25);
        box-shadow: 0 0 20px rgba(130, 150, 255, 0.45);
    }

    /* === ROTER BLINK-EFFEKT direkt auf dem Body === */
    .blink-red {
        animation: blinkRed 0.6s infinite alternate;
    }

    @keyframes blinkRed {
        from { background-color: rgba(255, 0, 0, 0.20); }
        to   { background-color: rgba(255, 0, 0, 0.65); }
    }
</style>
</head>

<body id="body">

    <h2 id="status">Gestartet: Stehen</h2>

    <div class="timer">Seit: <span id="seit">00:00</span></div>
    <div class="timer">Erinnerung in: <span id="remind">--:--</span></div>

    <div class="timer">Gesamt Sitzen: <span id="sitzen">00:00</span></div>
    <div class="timer">Gesamt Stehen: <span id="stehen">00:00</span></div>

    <div class="settings-row">
        Ziel: <span id="zielSitzen">25</span>m Sit 
        <button class="small-btn" onclick="changeSit(5)">+5</button> | 
        <span id="zielStehen">35</span>m Steh 
        <button class="small-btn" onclick="changeStand(-5)">-5</button> |
        <button class="small-btn reset-btn" onclick="resetSettings()">Reset</button>
    </div>

    <div class="button-container">
        <button onclick="start()">Start</button>
        <button onclick="stop()">Stop</button>
        <button onclick="sitze()">Ich sitze jetzt</button>
        <button onclick="stehe()">Ich stehe jetzt</button>
    </div>

<script>
// Standard-Vorgaben definieren
const DEFAULT_SITZEN = 25;
const DEFAULT_STEHEN = 35;

// Werte beim Start aus dem Speicher laden (falls vorhanden), sonst Standard nutzen
let interval_sitzen_min = parseInt(localStorage.getItem("sitzen_min")) || DEFAULT_SITZEN;
let interval_stehen_min = parseInt(localStorage.getItem("stehen_min")) || DEFAULT_STEHEN;

let interval_sitzen_sec = interval_sitzen_min * 60;
let interval_stehen_sec = interval_stehen_min * 60;

let state = "Stehen";
let running = false;
let paused = false;

let current_elapsed = 0;
let total_sitzen = 0;
let total_stehen = 0;
let next_reminder = interval_stehen_sec;
let last_ts = null;

// --- INTERVALL-ÄNDERUNGEN SPEICHERN ---
function changeSit(m) {
    interval_sitzen_min += m;
    interval_sitzen_sec = interval_sitzen_min * 60;
    
    // Im lokalen Speicher hinterlegen
    localStorage.setItem("sitzen_min", interval_sitzen_min);
    document.getElementById("zielSitzen").innerText = interval_sitzen_min;
    
    if(state === "Sitzen" && running) {
        next_reminder += (m * 60);
    }
    updateDisplay();
}

function changeStand(m) {
    if(interval_stehen_min + m < 5) return; 
    
    interval_stehen_min += m;
    interval_stehen_sec = interval_stehen_min * 60;
    
    // Im lokalen Speicher hinterlegen
    localStorage.setItem("stehen_min", interval_stehen_min);
    document.getElementById("zielStehen").innerText = interval_stehen_min;
    
    if(state === "Stehen" && running) {
        next_reminder += (m * 60);
    }
    updateDisplay();
}

// --- SYSTEM-RESET (Morgens oder zwischendurch) ---
function resetSettings() {
    // 1. Lokalen Speicher leeren
    localStorage.removeItem("sitzen_min");
    localStorage.removeItem("stehen_min");

    // 2. Intervalle auf Standard zurücksetzen
    interval_sitzen_min = DEFAULT_SITZEN;
    interval_stehen_min = DEFAULT_STEHEN;
    interval_sitzen_sec = DEFAULT_SITZEN * 60;
    interval_stehen_sec = DEFAULT_STEHEN * 60;

    // 3. Laufende Zeiten und Gesamtzeiten komplett nullen
    total_sitzen = 0;
    total_stehen = 0;
    current_elapsed = 0;
    next_reminder = state === "Sitzen" ? interval_sitzen_sec : interval_stehen_sec;

    // 4. UI-Elemente live updaten
    document.getElementById("zielSitzen").innerText = interval_sitzen_min;
    document.getElementById("zielStehen").innerText = interval_stehen_min;
    
    // 5. Blinken aufheben, falls aktiv
    stopBlink();
    
    updateDisplay();
}
// -------------------------------------------------

function fmtHMS(sec){
  let s=Math.max(0,Math.round(sec));
  let h=Math.floor(s/3600);
  let m=Math.floor((s%3600)/60);
  s=s%60;
  return h?`${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`:`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function updateDisplay(msg){
  document.getElementById("status").innerText = msg || `Jetzt: ${state}`;
  document.getElementById("seit").innerText = fmtHMS(current_elapsed);
  document.getElementById("remind").innerText = running ? fmtHMS(Math.max(0,next_reminder-current_elapsed)):"--:--";
  document.getElementById("sitzen").innerText = fmtHMS(total_sitzen);
  document.getElementById("stehen").innerText = fmtHMS(total_stehen);
}

let blinking = false;

function triggerBlink() {
    const body = document.getElementById("body");
    body.classList.add("blink-red");
    blinking = true;
}

function stopBlink() {
    if(blinking){
        const body = document.getElementById("body");
        body.classList.remove("blink-red");
        blinking = false;
    }
}

function tick(){
  if(!running || paused) return;
  let now = Date.now()/1000;
  let elapsed = last_ts? Math.min(5, now-last_ts) : 0.2;
  last_ts = now;

  current_elapsed+=elapsed;
  if(state==="Sitzen") total_sitzen+=elapsed;
  else total_stehen+=elapsed;

  let interval = state==="Sitzen"? interval_sitzen_sec : interval_stehen_sec;

  if(current_elapsed>=next_reminder){
    next_reminder += interval;
    triggerBlink();
    document.getElementById("status").innerText = `⚠️ Erinnerung: ${state}`;
    setTimeout(()=>updateDisplay(),2000);
  }
  updateDisplay();
}

setInterval(tick,200);

function startWithState(s){
  running=true; paused=false; state=s; current_elapsed=0;
  next_reminder = state==="Sitzen"? interval_sitzen_sec : interval_stehen_sec;
  last_ts = null;
  updateDisplay(`Gestartet: ${state}`);
}

function start(){startWithState("Stehen");}
function stop(){running=false; last_ts=null; updateDisplay("Gestoppt.");}

function sitze(){ 
    if(!running){startWithState("Sitzen"); return;} 
    stopBlink();
    state="Sitzen"; 
    current_elapsed=0; 
    next_reminder=interval_sitzen_sec;
    last_ts=null; 
    updateDisplay(`Jetzt: ${state}`);
}

function stehe(){ 
    if(!running){startWithState("Stehen"); return;} 
    stopBlink();
    state="Stehen"; 
    current_elapsed=0; 
    next_reminder=interval_stehen_sec;
    last_ts=null; 
    updateDisplay(`Jetzt: ${state}`);
}

// Initiale Anzeige der geladenen Werte sicherstellen
document.getElementById("zielSitzen").innerText = interval_sitzen_min;
document.getElementById("zielStehen").innerText = interval_stehen_min;
updateDisplay();
</script>

</body>
</html>
